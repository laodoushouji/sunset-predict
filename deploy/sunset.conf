server {
    listen 80;
    server_name sunsetpredict.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sunsetpredict.cloud;

    ssl_certificate /etc/nginx/ssl/sunsetpredict.cloud.crt;
    ssl_certificate_key /etc/nginx/ssl/sunsetpredict.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location = / {
        proxy_pass http://127.0.0.1:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sunset {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3003/health;
        proxy_set_header Host $host;
    }

    location ~ ^/credits/?$ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
    }

    location ~ ^/(css|js|assets)/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
    }

    location = /wechat-pay.jpg {
        proxy_pass http://127.0.0.1:3003/wechat-pay.jpg;
        proxy_set_header Host $host;
    }

    location /focus/ {
        alias /usr/share/nginx/html/focus/;
        index index.html;
        try_files $uri $uri/ /focus/index.html;
    }

    location = /focus {
        return 301 /focus/;
    }

    location = /stockdd {
        return 301 /stockdd/;
    }
    location /stockdd/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /game { return 301 /game/; }
    location = /game/review-status { return 301 /game/; }
    location = /game/review-status/ { return 301 /game/; }
    location = /game/wp-login.php { return 404; }
    location = /game/wp-cron.php { return 404; }
    location = /game/xmlrpc.php { return 404; }
    location = /game/wp-json { return 404; }
    location ^~ /game/wp-json/ { return 404; }
    location ^~ /game/wp-admin/ { return 404; }
    location ^~ /game/wp-includes/ { return 404; }
    location ^~ /game/wp-content/ { return 404; }
    location ^~ /game/feed/ { return 404; }
    location ^~ /game/comments/ { return 404; }
    location ^~ /game/ {
        rewrite ^/game/games/(war-thunder|genshin-impact|cyberpunk-2077|path-of-exile-2|helldivers-2|baldurs-gate-3|the-finals|marvel-rivals)/?$ /game/can-i-run-$1/ permanent;
        alias /opt/game-specs-pseo-static/;
        index index.html;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /umami/script.js {
        proxy_pass http://127.0.0.1:3002/script.js;
        proxy_set_header Host umami.sunsetpredict.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /umami/api/send {
        proxy_pass http://127.0.0.1:3002/api/send;
        proxy_set_header Host umami.sunsetpredict.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
