server {
    listen 80;
    listen [::]:80;
    server_name glowsunset.cn www.glowsunset.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://glowsunset.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 8.130.45.255;

    client_max_body_size 2m;

    location = /umami/script.js {
        proxy_pass https://sunsetpredict.cloud/umami/script.js;
        proxy_ssl_server_name on;
        proxy_set_header Host sunsetpredict.cloud;
    }

    location = /umami/api/send {
        proxy_pass https://sunsetpredict.cloud/umami/api/send;
        proxy_ssl_server_name on;
        proxy_set_header Host sunsetpredict.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.glowsunset.cn;

    ssl_certificate /etc/nginx/ssl/glowsunset/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/glowsunset/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://glowsunset.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name glowsunset.cn;

    ssl_certificate /etc/nginx/ssl/glowsunset/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/glowsunset/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    location = /umami/script.js {
        proxy_pass https://sunsetpredict.cloud/umami/script.js;
        proxy_ssl_server_name on;
        proxy_set_header Host sunsetpredict.cloud;
    }

    location = /umami/api/send {
        proxy_pass https://sunsetpredict.cloud/umami/api/send;
        proxy_ssl_server_name on;
        proxy_set_header Host sunsetpredict.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
